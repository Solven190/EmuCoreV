name: Android CI

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: release
        type: choice
        options: [release, debug]

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

env:
  NDK_VERSION: "29.0.14206865"
  CMAKE_VERSION: "3.22.1"
  COMPILE_SDK: "37"
  BUILD_TOOLS_VERSION: "37.0.0"
  VCPKG_BASELINE: "77df67cfff9c12ccfdb52284e07c87c75092f723"
  RUST_VERSION: "stable"
  BUILD_TYPE: ${{ inputs.build_type }}
  ECV_DIR: app/src/main/cpp/emucorev/ECV

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Restore submodules
        timeout-minutes: 10
        run: |
          [ -f "$ECV_DIR/.gitmodules" ] || exit 0

          while read -r key path; do
            name="${key#submodule.}"; name="${name%.path}"
            url="$(git config -f "$ECV_DIR/.gitmodules" --get "submodule.${name}.url")"
            target="$ECV_DIR/$path"
            if [ -d "$target" ] && [ -n "$(ls -A "$target" 2>/dev/null)" ]; then continue; fi
            sha="$(git ls-tree HEAD -- "$target" | awk '$1=="160000"{print $3}')"
            [ -n "$sha" ] || { echo "::error::Pinned commit not found: $path"; exit 1; }
            mkdir -p "$target"
            git -C "$target" init -q
            git -C "$target" remote add origin "$url"
            git -C "$target" fetch -q --depth 1 origin "$sha"
            git -C "$target" checkout -q FETCH_HEAD
          done < <(git config -f "$ECV_DIR/.gitmodules" --get-regexp '^submodule\..*\.path$')

      - name: Configure Google Services
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          [ -f app/google-services.json ] && exit 0
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "::warning::Using placeholder Firebase configuration"
            cat > app/google-services.json <<'EOF'
          {"project_info":{"project_number":"000000000000","project_id":"placeholder-project","storage_bucket":"placeholder-project.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"com.sbro.emucorev"}},"oauth_client":[{"client_id":"000000000000-placeholder.apps.googleusercontent.com","client_type":3}],"api_key":[{"current_key":"placeholder"}],"services":{"appinvite_service":{"other_platform_oauth_client":[{"client_id":"000000000000-placeholder.apps.googleusercontent.com"}]}}}],"configuration_version":"1"}
          EOF
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Decode release keystore
        if: inputs.build_type == 'release'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.keystore"
          chmod 600 "$RUNNER_TEMP/signing/release.keystore"
          [ -s "$RUNNER_TEMP/signing/release.keystore" ] \
            || { echo "::error::Keystore file is empty or invalid base64"; exit 1; }

      - name: Configure local.properties
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          umask 077
          {
            printf 'python3.path=%s\n' "$(command -v python3)"
            if [ "$BUILD_TYPE" = "release" ]; then
              printf 'emucorev.release.storeFile=%s\n' "$RUNNER_TEMP/signing/release.keystore"
              printf 'emucorev.release.storePassword=%s\n' "$STORE_PASSWORD"
              printf 'emucorev.release.keyAlias=%s\n' "$KEY_ALIAS"
              printf 'emucorev.release.keyPassword=%s\n' "$KEY_PASSWORD"
            fi
          } > local.properties

      - name: Install toolchain (SDK, NDK, Rust, CMake)
        timeout-minutes: 30
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platforms;android-${COMPILE_SDK}.0" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

          ln -sfn "$ANDROID_HOME/platforms/android-${COMPILE_SDK}.0" "$ANDROID_HOME/platforms/android-${COMPILE_SDK}"

          rustup toolchain install "$RUST_VERSION" --profile minimal --target aarch64-linux-android
          rustup default "$RUST_VERSION"

          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache

          {
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION"
            echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION"
            echo "CCACHE_DIR=$HOME/.ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_MAXSIZE=2G"
            echo "CCACHE_COMPRESS=1"
            echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
          } >> "$GITHUB_ENV"

      - name: Set up vcpkg and cache key
        id: setup
        timeout-minutes: 10
        env:
          VCPKG_MANIFEST_HASH: ${{ hashFiles('app/src/main/cpp/emucorev/ECV/vcpkg.json') }}
        run: |
          mkdir -p third_party
          git clone -q https://github.com/microsoft/vcpkg.git third_party/vcpkg
          git -C third_party/vcpkg checkout -q --detach "$VCPKG_BASELINE"
          ./third_party/vcpkg/bootstrap-vcpkg.sh -disableMetrics

          RUSTC_VERSION="$(rustc --version | awk '{print $2}')"
          PREFIX="emucorev-${RUNNER_OS}-${BUILD_TYPE}-${NDK_VERSION}-${RUSTC_VERSION}-"
          {
            echo "key_prefix=$PREFIX"
            echo "key_manifest=${PREFIX}${VCPKG_MANIFEST_HASH}-"
          } >> "$GITHUB_OUTPUT"

          {
            echo "VCPKG_ROOT=$GITHUB_WORKSPACE/third_party/vcpkg"
            echo "VCPKG_DISABLE_METRICS=1"
          } >> "$GITHUB_ENV"

      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.ccache
            ~/.cargo/registry
            ~/.cargo/git
            third_party/vcpkg/downloads
            app/src/main/cpp/emucorev/ECV/vcpkg_installed
          key: ${{ steps.setup.outputs.key_manifest }}${{ github.run_id }}
          restore-keys: |
            ${{ steps.setup.outputs.key_manifest }}
            ${{ steps.setup.outputs.key_prefix }}

      - name: Install native deps
        timeout-minutes: 60
        working-directory: app/src/main/cpp/emucorev/ECV
        run: |
          "$VCPKG_ROOT/vcpkg" install --triplet arm64-android --host-triplet x64-linux

          PREFIX="$PWD/vcpkg_installed/arm64-android"
          OUT="$GITHUB_WORKSPACE/tools/openssl-test/out"
          mkdir -p "$(dirname "$OUT")"
          rm -rf "$OUT"
          ln -s "$PREFIX" "$OUT"

      - name: Build APK
        timeout-minutes: 120
        run: |
          ccache -z
          chmod +x ./gradlew
          ./gradlew ":app:assemble${BUILD_TYPE^}" --parallel --build-cache --stacktrace

      - name: ccache statistics
        if: always()
        run: ccache -s || true

      - name: Save cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.ccache
            ~/.cargo/registry
            ~/.cargo/git
            third_party/vcpkg/downloads
            app/src/main/cpp/emucorev/ECV/vcpkg_installed
          key: ${{ steps.setup.outputs.key_manifest }}${{ github.run_id }}

      - name: Package and verify APK
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          SRC_APK="$(find "app/build/outputs/apk/$BUILD_TYPE" -maxdepth 1 \
                       -name '*.apk' ! -name '*-unsigned.apk' -print -quit)"
          [ -n "$SRC_APK" ] || { echo "::error::Signed APK not found"; exit 1; }

          mkdir -p dist
          DEST="dist/EmuCoreV-${BUILD_TYPE}-${RUN_NUMBER}.apk"
          cp "$SRC_APK" "$DEST"

          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose --print-certs "$DEST"

      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/signing"
          rm -f local.properties app/google-services.json

      - uses: actions/upload-artifact@v4
        with:
          name: EmuCoreV-${{ inputs.build_type }}-${{ github.run_number }}
          path: dist/*.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 1